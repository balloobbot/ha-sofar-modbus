name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --group test --group dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy custom_components/sofar_modbus

      - name: Run Test Suite
        run: |
          uv run python tests/lib/test_smoke.py
          uv run python tests/lib/test_coordinator.py
          uv run python tests/lib/test_diagnostics.py
          uv run python tests/lib/test_write_entities.py
